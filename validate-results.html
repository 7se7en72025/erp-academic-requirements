<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Classes to Shopping Cart</title>
<link rel="stylesheet" href="chrome.css?v=5">
</head>
<body>
<div id="chrome-root"></div>
<script src="data.js?v=5"></script>
<script src="chrome.js?v=5"></script>
<script>
renderChrome({ active: 'shopping-cart', pageName: 'Registration' });

// Validate is a dry run: it reports on the cart (plus anything already
// enrolled) without adding anything. Each course's sections are checked for
// a meeting-time overlap against every other course in the cart/schedule.
var cart = getCart();
var everything = getEnrolled().concat(cart);

function courseBlocks(entry) {
  return scheduleBlocks([entry]);
}

function findClash(entry) {
  var mine = courseBlocks(entry);
  for (var i = 0; i < everything.length; i++) {
    var other = everything[i];
    if (other.courseId === entry.courseId) continue;
    var theirs = courseBlocks(other);
    for (var a = 0; a < mine.length; a++) {
      for (var b = 0; b < theirs.length; b++) {
        var m = mine[a], t = theirs[b];
        if (m.day === t.day && m.start < t.end && t.start < m.end) {
          return { mineNbr: m.sec.nbr, otherNbr: t.sec.nbr };
        }
      }
    }
  }
  return null;
}

var rows = cart.map(function (e) {
  var c = COURSES[e.courseId];
  var parts = c.code.split(' ');
  var clash = findClash(e);
  if (clash) {
    return '<tr><td>' + parts[0] + '</td><td>' + parts[1] + '</td>' +
      '<td>There is a time conflict for class number ' + clash.mineNbr + ' and class number ' +
      clash.otherNbr + '. There is currently a meeting time conflict for two of your shopping ' +
      'cart classes or a shopping cart class and one of your enrolled classes for this term. ' +
      'Use the class numbers to check the meeting times.</td>' +
      '<td class="center"><span class="xmark">&#10008;</span></td></tr>';
  }
  return '<tr><td>' + parts[0] + '</td><td>' + parts[1] + '</td>' +
    '<td>OK to Add</td>' +
    '<td class="center"><span class="chk">&#10003;</span></td></tr>';
}).join('') || '<tr><td colspan="4" style="padding:16px;">Your shopping cart is empty.</td></tr>';

document.getElementById('main-content').innerHTML =
  idRowHtml() + tabsHtml('Plan') +
  '<div class="subnav"><span class="current">Shopping Cart</span>' +
    '<span class="sep">|</span><a href="#">Course History</a></div>' +
  '<h1 class="page-title">Shopping Cart</h1>' +
  '<h2 class="page-title" style="border:none;">Add Classes to Shopping Cart</h2>' +
  '<p class="breadcrumb">View the following status report for enrollment confirmations and errors</p>' +
  '<div class="legend">' +
    '<span><span class="chk">&#10003;</span> OK to Add</span>' +
    '<span><span class="xmark">&#10008;</span> Potential Problem</span>' +
  '</div>' +
  '<div class="grid-scroll" style="margin-left:8px;"><table class="data">' +
    '<thead><tr><th colspan="2">Description</th><th>Message</th><th>Status</th></tr></thead>' +
    '<tbody>' + rows + '</tbody>' +
  '</table></div>' +
  '<div class="cart-actions">' +
    '<button class="ps-btn" onclick="location.href=\'shopping-cart.html?_c=5\'">Registration Cart</button>' +
    '<button class="ps-btn primary" onclick="location.href=\'enroll-results.html?_c=5\'">Proceed to Enroll</button>' +
  '</div>' +
  '<p class="go-top"><a href="#">Go to top</a></p>';
</script>
</body>
</html>
